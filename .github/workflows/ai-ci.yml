name: AI CI

on:
  push:
    paths: ["ai/**", ".github/workflows/ai-ci.yml"]
  pull_request:
    paths: ["ai/**", ".github/workflows/ai-ci.yml"]

defaults:
  run:
    working-directory: ai

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Typecheck
        run: mypy

      # The raw corpus is not in the repo, so corpus-dependent tests self-skip.
      # The unit tests that encode the leakage invariants still run on every push.
      - name: Test
        run: pytest -v
