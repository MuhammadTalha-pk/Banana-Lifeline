[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banana-lifeline"
version = "0.1.0"
description = "AI layer for Banana Lifeline: banana disease classification, OOD rejection, and grounded agricultural guidance."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

# Core deps only. Everything here must install and run on a plain laptop with no GPU,
# because Phase 1 (data audit + split) has to be reproducible without cloud access.
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1",
    "pillow>=10.2",
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Training stack. Installed on the Google Cloud GPU box, not needed locally.
vision = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=0.9.16",
    "albumentations>=1.4",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "grad-cam>=1.5",
]
rag = [
    "qdrant-client>=1.8",
    "FlagEmbedding>=1.2",
    "pypdf>=4.1",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
]
gen = [
    "openai>=1.30",  # DeepSeek exposes an OpenAI-compatible API
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pandas-stubs",
    "types-PyYAML",
]

[project.scripts]
banana = "banana_lifeline.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # typer uses function calls in argument defaults by design

[tool.ruff.lint.per-file-ignores]
# These modules are mostly markdown and HTML templates rendered into report artefacts.
# Wrapping a markdown table row to satisfy a code line limit would break the table, and the
# typographic characters (x, en dashes) are intentional in prose meant for human readers.
"src/banana_lifeline/data/audit.py" = ["E501", "RUF001"]
"src/banana_lifeline/data/review.py" = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.11"
packages = ["banana_lifeline"]
mypy_path = "src"
strict = true
warn_unreachable = true
# Without this plugin mypy cannot see pydantic's generated __init__, and every model
# construction is reported as a missing-argument error.
plugins = ["pydantic.mypy"]

# Third-party ML libs ship incomplete or absent stubs; don't let that block our own typing.
# torch/timm are only installed on the GPU box, so they are unresolvable in local and CI runs
# by design -- the core data pipeline must typecheck without the training stack present.
[[tool.mypy.overrides]]
module = [
    "timm.*",
    "torch.*",
    "torchvision.*",
    "albumentations.*",
    "cv2.*",
    "tqdm.*",
    "sklearn.*",
    "FlagEmbedding.*",
    "qdrant_client.*",
    "pytorch_grad_cam.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that read the full image corpus",
]
