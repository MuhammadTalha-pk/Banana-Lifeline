name: banana_lifeline
description: Production-style Banana Lifeline mobile app integrating Firebase and the supplied AI layer.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  dio: ^5.11.0

  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_messaging: ^16.4.3

  image_picker: ^1.2.2
  geolocator: ^14.0.3
  geocoding: ^4.0.0
  connectivity_plus: ^7.3.1

  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  record: ^6.2.1
  just_audio: ^0.10.6

  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  uuid: ^4.5.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
